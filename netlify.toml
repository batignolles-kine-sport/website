# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Static assets - long cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - no cache (always fetch fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images and fonts - medium cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin CMS redirect (not pre-rendered)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Blog-genius (admin page, not pre-rendered)
[[redirects]]
  from = "/blog-genius"
  to = "/index.html"
  status = 200

# Design system (not pre-rendered)
[[redirects]]
  from = "/design-system"
  to = "/index.html"
  status = 200

# Legacy pathologies redirects to blog
[[redirects]]
  from = "/pathologies/*"
  to = "/blog/:splat"
  status = 301

# Blog trailing slash redirect - forces canonical without trailing slash
# Only for /blog/* routes — static pages (/pratiques, /equipe, etc.) are handled natively by Netlify Pretty URLs
[[redirects]]
  from = "/blog/*/"
  to = "/blog/:splat"
  status = 301
  force = true

# Services root redirect
[[redirects]]
  from = "/services"
  to = "/services/kine-sport"
  status = 301

# Strict HTTPS and non-www enforcement
[[redirects]]
  from = "http://batignolleskinesport.fr/*"
  to = "https://batignolleskinesport.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.batignolleskinesport.fr/*"
  to = "https://batignolleskinesport.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.batignolleskinesport.fr/*"
  to = "https://batignolleskinesport.fr/:splat"
  status = 301
  force = true

# Fallback SPA routing (resolves potential 404s or redirect loops for dynamic routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
