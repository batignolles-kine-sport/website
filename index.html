<!DOCTYPE html>

<head>

  <!-- Robots Meta Tag - common to all pages -->

  <!--

    for each page during Static Site Generation (SSG).
  -->

  <!-- Language -->
  <meta http-equiv="content-language" content="fr" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0D2918" />

  <!-- DNS Prefetch for external resources -->
  <!-- <link rel="dns-prefetch" href="https://fonts.googleapis.com"> removed -->
  <!-- <link rel="dns-prefetch" href="https://fonts.gstatic.com"> removed -->
  <link rel="dns-prefetch" href="https://www.doctolib.fr">
  <link rel="dns-prefetch" href="https://cdn.openwidget.com">

  <!-- Preload Critical Fonts (Latin for French content) -->

  <link rel="preload" href="/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa25L7W0Q5n-wU.woff2" as="font" type="font/woff2"
    crossorigin />

  <!-- Preload LCP Image - LOCAL OPTIMIZED -->
  <!-- Mobile & Tablet Portrait (< 1024px) -->
  <link rel="preload" as="image" fetchpriority="high" href="/images/hero/hero-mobile.webp"
    media="(max-width: 1023px)" />
  <!-- Desktop (>= 1024px) -->
  <link rel="preload" as="image" fetchpriority="high" href="/images/hero/hero-horizontal.webp"
    media="(min-width: 1024px)" />

  <!-- Google Fonts - Self-hosted via CSS import -->
  <!-- <link href="https://fonts.googleapis.com/css2..." rel="stylesheet"> removed -->



  <style>
    :root {
      --navbar-height: 5rem;
    }

    body {
      margin: 0;
      background: #ffffff;
      min-height: 100vh;
    }

    /* CSS critique minimal pour éviter layout shift */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .header-navbar {
      height: var(--navbar-height);
      max-height: var(--navbar-height);
    }
  </style>
</head>

  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Dummy form for Netlify Bots to register the contact form -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="firstName" />
