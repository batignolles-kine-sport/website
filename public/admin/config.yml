backend:
  name: github
  repo: batignolles-kine-sport/website
  branch: main
  auth_endpoint: /api/auth

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "pathologies"
    label: "Pathologies & Articles"
    folder: "src/posts/pathologies"
    create: true
    slug: "{{slug}}"
    preview_path: "/blog/{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string", required: true }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Genou", "Cheville", "Hanche", "Cuisse", "Jambe", "Pied", "Épaule", "Coude", "Poignet", "Dos", "Tête", "Grossesse", "Post-partum", "Périnée", "Prévention", "Os", "Cabinet", "Général"], required: true }
      - { label: "Sport (Optionnel)", name: "sport", widget: "string", required: false }
      - { label: "Type", name: "type", widget: "select", options: ["Rachis", "Membre Inférieur", "Membre Supérieur", "Kiné de la femme", "Méthodologie", "Autres"], required: true }
      - { label: "Image", name: "image", widget: "image", required: true }
      - { label: "Temps de lecture", name: "readTime", widget: "string", default: "5 min" }
      - { label: "Extrait (résumé)", name: "excerpt", widget: "text", required: true }
      - { label: "Date de publication", name: "publishedAt", widget: "string", pattern: ["^\\d{2} [A-Za-z]+ \\d{4}$", "Format: 17 Décembre 2025"] }
      - { label: "Afficher sur le blog", name: "featured", widget: "boolean", default: true, required: false, hint: "Décocher pour masquer cet article de la liste principale du blog (il restera accessible via son URL directe)" }
      - { label: "Contenu", name: "body", widget: "markdown", required: true }
